name: MOROTTO authorized Avito import

on:
  workflow_dispatch:
    inputs:
      search_id:
        description: "Optional Supabase scrape_searches UUID. Leave empty to process all enabled and authorized searches."
        required: false
        type: string
      dry_run:
        description: "Parse results but do not write listings."
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: morotto-avito-scraper
  cancel-in-progress: false

jobs:
  scrape:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      - name: Run authorized saved searches
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          AVITO_IMPORT_AUTHORIZED: ${{ secrets.AVITO_IMPORT_AUTHORIZED }}
          SCRAPE_SEARCH_ID: ${{ github.event.inputs.search_id }}
          SCRAPE_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: python scraper/scraper.py
