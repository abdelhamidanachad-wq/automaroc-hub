name: Build MOROTTO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - name: Install Node dependencies
        run: npm install
      - name: Check API JavaScript syntax
        run: |
          node --check api/demo-vehicle-image.js
          node --check api/admin/scrape-searches.js
          node --check api/admin/scrape-avito.js
      - name: Install scraper dependencies
        run: pip install -r scraper/requirements.txt
      - name: Compile scraper and run unit tests
        run: |
          python -m py_compile scraper/scraper.py
          python -m unittest discover -s scraper/tests -v
      - name: Build frontend
        run: npm run build
